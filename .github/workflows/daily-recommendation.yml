name: Daily Game Recommendation

on:
  schedule:
    # Runs at 09:00 UTC everyday (12:00 TRT). GitHub may start scheduled runs a few hours late.
    - cron: "0 9 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

# Never run two recommendations at once, they would race on data/history.json.
concurrency:
  group: daily-recommendation
  cancel-in-progress: false

jobs:
  recommend-game:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Check out the branch tip rather than the triggering commit, so re-runs see the latest history
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck and Test
        run: |
          npm run typecheck
          npm test

      - name: Run Recommendation Bot
        id: bot
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: npm start

      - name: Commit History Update
        # Commits the updated history.json back to the repo so we don't recommend the same game again.
        # Also runs when the bot failed on some platforms, since the game may have reached the others.
        if: ${{ !cancelled() && steps.bot.conclusion != 'skipped' }}
        run: |
          git config --global user.name 'GameBot'
          git config --global user.email 'bot@noreply.github.com'
          git add data/history.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update game history [skip ci]"
          # Rebase in case main moved since checkout (e.g. a re-run of an older run)
          git pull --rebase
          git push
