name: Post to X

on:
  schedule:
    # 12:44 German time (CET/CEST, DST handled by GitHub). Off the full hour, when GitHub is busiest
    # and may delay or drop scheduled runs. Runs can still start late under load.
    - cron: "44 12 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch: # Allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  post:
    uses: ./.github/workflows/post.yml
    with:
      platform: x
    secrets: inherit
