name: Post Recommendation

# Shared steps for every platform. Each platform has its own small workflow (post-<platform>.yml)
# with its own schedule that calls this one, so platforms run, fail and can be disabled independently.
on:
  workflow_call:
    inputs:
      platform:
        description: Platform to post to (x, bluesky)
        required: true
        type: string

jobs:
  post:
    runs-on: ubuntu-latest

    # Never run two posts for the same platform at once, they would race on its history file.
    concurrency:
      group: post-${{ inputs.platform }}
      cancel-in-progress: false

    env:
      PLATFORM: ${{ inputs.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Check out the branch tip rather than the triggering commit, so re-runs see the latest history
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck and Test
        run: |
          npm run typecheck
          npm test

      - name: Run Recommendation Bot
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: npm start -- "$PLATFORM"

      - name: Commit History Update
        # Commits the platform's history file back to the repo so we don't recommend the same game again
        run: |
          git config --global user.name 'GameBot'
          git config --global user.email 'bot@noreply.github.com'
          git add data/history
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update $PLATFORM history [skip ci]"
          # Rebase in case main moved since checkout (e.g. the other platform posted meanwhile)
          git pull --rebase
          git push
